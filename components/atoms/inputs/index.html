<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inputs — Design System</title>
  <link rel="stylesheet" href="../../../tokens/tokens.css">
  <link rel="stylesheet" href="../../../base/reset.css">
  <link rel="stylesheet" href="../../../base/base.css">
  <link rel="stylesheet" href="../../../base/utilities.css">
  <link rel="stylesheet" href="../buttons/style.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../scripts/shared/device-preview.css">
  <style>
    /* ── Demo page only — não copie para produção ── */
    body {
      padding: var(--space-3xl) var(--space-xl);
      background-color: var(--color-background-alt);
      font-family: var(--font-body);
    }
    .demo-section { max-width: 420px; margin-inline: auto; margin-block-end: var(--space-3xl); }
    .demo-section__title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-wider);
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-block-end: var(--space-lg);
    }
    .demo-form { display: flex; flex-direction: column; gap: var(--space-lg); background: var(--color-background); padding: var(--space-xl); border-radius: var(--radius-xl); border: 1px solid var(--color-border); }
  </style>
</head>
<body>

<!-- DS Navigator Bar — utilitário de navegação, não é parte do componente -->
<div id="ds-nav-bar">
  <a href="../../../index.html" id="ds-nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Todos os componentes
  </a>
  <span id="ds-nav-label">Inputs</span>
</div>
<style>
  #ds-nav-bar { position: sticky; top: 0; z-index: 9999; background: #0F0E1A; border-bottom: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 40px; gap: 16px; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
  #ds-nav-back { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.65); text-decoration: none; font-weight: 500; transition: color .15s; white-space: nowrap; }
  #ds-nav-back:hover { color: #fff; }
  #ds-nav-back svg { flex-shrink: 0; }
  #ds-nav-label { font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: .04em; white-space: nowrap; }
</style>

  <p class="demo-section__title" style="text-align:center; padding-top: var(--space-xl);">Campos de texto, seleção e estado de erro</p>

  <div class="demo-section">
    <form class="demo-form" novalidate>

      <div class="input-field">
        <label class="input-field__label" for="inp-name">Nome completo</label>
        <input class="input-field__control" type="text" id="inp-name" name="name" placeholder="Maria Souza" autocomplete="name">
      </div>

      <div class="input-field">
        <label class="input-field__label" for="inp-email">E-mail</label>
        <input class="input-field__control" type="email" id="inp-email" name="email" placeholder="maria@empresa.com" autocomplete="email">
        <span class="input-field__hint">Usamos apenas para te enviar a resposta.</span>
      </div>

      <div class="input-field input-field--invalid">
        <label class="input-field__label" for="inp-phone">Telefone</label>
        <input class="input-field__control" type="tel" id="inp-phone" name="phone" placeholder="(11) 99999-9999" autocomplete="tel" aria-describedby="inp-phone-error" aria-invalid="true">
        <span class="input-field__hint">Com DDD, só números.</span>
        <span class="input-field__error" id="inp-phone-error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Informe um telefone válido.
        </span>
      </div>

      <div class="input-field">
        <label class="input-field__label" for="inp-plan">Plano de interesse</label>
        <select class="input-field__control" id="inp-plan" name="plan">
          <option>Starter</option>
          <option>Pro</option>
          <option>Enterprise</option>
        </select>
      </div>

      <div class="input-field">
        <label class="input-field__label" for="inp-msg">Mensagem <span class="input-field__optional">(opcional)</span></label>
        <textarea class="input-field__control" id="inp-msg" name="message" placeholder="Conte um pouco sobre o que você precisa..."></textarea>
      </div>

      <div class="input-group">
        <label class="input-check">
          <input class="input-check__input" type="checkbox" name="newsletter" checked>
          <span class="input-check__box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
          </span>
          Quero receber novidades por e-mail
        </label>
      </div>

      <div class="input-group">
        <span class="input-field__label">Forma de contato preferida</span>
        <label class="input-radio">
          <input class="input-radio__input" type="radio" name="contact-pref" value="email" checked>
          <span class="input-radio__box"><span class="input-radio__dot"></span></span>
          E-mail
        </label>
        <label class="input-radio">
          <input class="input-radio__input" type="radio" name="contact-pref" value="whatsapp">
          <span class="input-radio__box"><span class="input-radio__dot"></span></span>
          WhatsApp
        </label>
      </div>

      <button class="button button--filled button--lg" type="submit">Enviar</button>
    </form>
  </div>

  <script src="../../../scripts/shared/device-preview.js"></script>
</body>
</html>
