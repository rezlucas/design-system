<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Grid — Design System</title>
  <link rel="stylesheet" href="../../../../tokens/tokens.css">
  <link rel="stylesheet" href="../../../../base/reset.css">
  <link rel="stylesheet" href="../../../../base/base.css">
  <link rel="stylesheet" href="../../../../base/utilities.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../scripts/shared/device-preview.css">
</head>
<body>

<!-- DS Navigator Bar — utilitário de navegação, não é parte do componente -->
<div id="ds-nav-bar">
  <a href="../../../../index.html" id="ds-nav-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Todos os componentes
  </a>
  <span id="ds-nav-label">Gallery Grid</span>
</div>
<style>
  #ds-nav-bar { position: sticky; top: 0; z-index: 9999; background: #0F0E1A; border-bottom: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 40px; gap: 16px; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }
  #ds-nav-back { display: inline-flex; align-items: center; gap: 6px; color: rgba(255,255,255,.65); text-decoration: none; font-weight: 500; transition: color .15s; white-space: nowrap; }
  #ds-nav-back:hover { color: #fff; }
  #ds-nav-back svg { flex-shrink: 0; }
  #ds-nav-label { font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: .04em; white-space: nowrap; }
</style>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-zoom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18l6-6-6-6"/>
    </symbol>
  </svg>

  <!-- ═══════════════════════════════ gallery-grid ═══════════════════════════════ -->

  <section class="gallery-grid" aria-labelledby="gg-title" data-js="gallery-grid">
    <div class="container">

      <div class="gallery-grid__header">
        <span class="gallery-grid__eyebrow">Portfólio</span>
        <h2 class="gallery-grid__title" id="gg-title">Projetos que já entregamos</h2>
        <p class="gallery-grid__description">Clique em qualquer imagem para ver em tamanho maior.</p>
      </div>

      <ul class="gallery-grid__list" role="list">

        <li class="gallery-grid__item gallery-grid__item--big">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Identidade visual — Studio Form">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="painel de marca com paleta de cores e logo aplicado em papelaria" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Identidade visual — Studio Form</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="App de finanças — tela inicial">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="tela inicial de aplicativo de finanças em um smartphone" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>App de finanças</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item gallery-grid__item--tall">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Editorial — campanha de lançamento">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="cartaz vertical de campanha publicitária com tipografia grande" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Editorial — campanha</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Embalagem — linha de cosméticos">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="embalagens de produtos de cosmético sobre fundo neutro" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Embalagem</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item gallery-grid__item--wide">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Website — landing page institucional">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="landing page institucional aberta em um monitor" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Website institucional</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Sinalização de loja física">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="fachada de loja física com sinalização da marca" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Sinalização</span>
            </span>
          </button>
        </li>

        <li class="gallery-grid__item">
          <button class="gallery-grid__trigger" type="button" data-js="gallery-trigger" data-caption="Social media — calendário de posts">
            <img src="../../../../assets/images/placeholders/placeholder-image.png" alt="grade de posts de redes sociais em um feed simulado" loading="lazy" decoding="async">
            <span class="gallery-grid__overlay">
              <span class="gallery-grid__caption"><svg aria-hidden="true"><use href="#icon-zoom"/></svg>Social media</span>
            </span>
          </button>
        </li>

      </ul>
    </div>

    <dialog class="gallery-grid__lightbox" data-js="lightbox" aria-label="Imagem ampliada">
      <div class="gallery-grid__lightbox-body">
        <button class="gallery-grid__lightbox-close" type="button" data-js="lightbox-close" aria-label="Fechar">
          <svg aria-hidden="true"><use href="#icon-close"/></svg>
        </button>
        <button class="gallery-grid__lightbox-nav gallery-grid__lightbox-nav--prev" type="button" data-js="lightbox-prev" aria-label="Imagem anterior">
          <svg aria-hidden="true"><use href="#icon-chevron-left"/></svg>
        </button>
        <button class="gallery-grid__lightbox-nav gallery-grid__lightbox-nav--next" type="button" data-js="lightbox-next" aria-label="Próxima imagem">
          <svg aria-hidden="true"><use href="#icon-chevron-right"/></svg>
        </button>
        <div class="gallery-grid__lightbox-image-wrap">
          <img data-js="lightbox-image" src="" alt="">
        </div>
        <p class="gallery-grid__lightbox-caption" data-js="lightbox-caption"></p>
      </div>
    </dialog>
  </section>

  <script src="script.js"></script>
  <script src="../../../../scripts/shared/device-preview.js"></script>
</body>
</html>
